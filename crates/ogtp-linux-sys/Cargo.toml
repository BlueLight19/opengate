[package]
name = "ogtp-linux-sys"
version = "0.1.0"
edition = "2024"
description = "Auditable Linux sendmmsg boundary for OGTP"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "ogtp_linux_sys"

[package]
name = "ogtp-protocol"
version = "0.2.0"
edition = "2024"
description = "Experimental bounded-memory UDP transfer protocol"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "ogtp"
path = "src/lib.rs"

[dev-dependencies]
hmac = "0.12.1"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
